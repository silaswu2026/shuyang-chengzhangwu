<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0908" />
  <title>观世音菩萨 · 三维礼敬</title>
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>

  <header class="ui-top">
    <p class="eyebrow">云山寺</p>
    <h1>观世音菩萨</h1>
    <p class="sub">杨柳净瓶 · 德化白瓷造像</p>
  </header>

  <p class="hint" id="hint">拖动旋转 · 双指或滚轮缩放</p>

  <p class="merit" id="merit"></p>

  <nav class="actions" aria-label="礼敬">
    <button type="button" id="btn-bai">拜佛</button>
    <button type="button" id="btn-muyu">敲木鱼</button>
    <button type="button" id="btn-beads">捏佛珠</button>
  </nav>

  <button type="button" class="foyin-toggle is-on" id="foyin-toggle" aria-pressed="true">佛音</button>

  <div id="loader">
    <div class="loader-inner">
      <div class="lotus"></div>
      <p>正在迎请法像…</p>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
