<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1230">
<title>五树杨的 AI 办学小屋</title>
<link rel="stylesheet" href="brand-tokens.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);
  font-family:var(--family-font);
  background:var(--bg-deep)}
a{color:inherit;text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:0 0 40px}

/* —— Hero: family photo + title (core first screen) —— */
.hero{
  position:relative; min-height:42vh;
  background:#12162e center 28%/cover no-repeat;
  background-image:linear-gradient(180deg,#0f123088 0%,#0f1230ee 78%,#0b0e24 100%),
    url("shuyang-ai/avatars/cast-four.jpg");
  display:flex; align-items:flex-end; justify-content:center;
  padding:24px 16px 18px;
}
.hero-inner{width:100%; max-width:560px; text-align:center}
.hero .badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;
  color:var(--gold); background:#0006; border:1px solid var(--stroke);
  border-radius:999px; padding:6px 12px; margin-bottom:10px}
h1{margin:0;font-size:clamp(22px,6vw,34px);font-weight:800;line-height:1.25;
  text-shadow:0 2px 12px #000a}
.hero .hint{margin:8px 0 0;font-size:13px;color:var(--muted);font-weight:600}

/* —— Courses: compact list —— */
.courses{padding:14px 14px 0; max-width:560px; margin:0 auto}
.course{
  display:flex; align-items:center; gap:12px;
  background:linear-gradient(180deg,var(--card),#12162e);
  border:1px solid var(--stroke); border-radius:16px;
  padding:12px 14px; margin:0 0 10px;
  box-shadow:0 8px 20px #0004;
}
.course .n{
  flex:none; width:36px; height:36px; border-radius:12px;
  display:grid; place-items:center; font-weight:900; font-size:15px;
  background:var(--navy2); color:var(--gold); border:1px solid var(--gold2);
}
.course.today{border-color:rgba(62,207,106,.5); box-shadow:0 8px 24px rgba(62,207,106,.18)}
.course.today .n{background:linear-gradient(135deg,var(--green2),var(--green)); color:#062014; border:none}
.course .meta{flex:1; min-width:0}
.course .meta .tag{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.06em}
.course.today .meta .tag{color:var(--green)}
.course .meta h2{margin:2px 0 0;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course .chev{flex:none;color:var(--gold);font-weight:900;opacity:.85}

/* —— Secondary: collapsed on phone —— */
.more{max-width:560px;margin:8px auto 0;padding:0 14px}
.more details{
  background:#12162ecc; border:1px solid #ffffff14; border-radius:14px; padding:10px 14px;
}
.more summary{
  cursor:pointer; font-weight:800; font-size:14px; color:var(--muted);
  list-style:none; display:flex; justify-content:space-between; align-items:center;
}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"▾"; color:var(--gold)}
.more details[open] summary::after{content:"▴"}
.family{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0 8px; text-align:center}
.family img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:center 28%;border:2px solid var(--gold);
  background:#24306a; display:block; margin:0 auto}
.family figcaption{font-size:11px;color:var(--muted);margin-top:6px;font-weight:700}
.desc{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.links{margin:12px 0 4px;font-size:13px;line-height:1.7;color:var(--muted)}
.links a{color:var(--gold);text-decoration:underline;margin-right:8px}

/* Desktop: slightly roomier, show family strip without forcing open */
@media (min-width:760px){
  .hero{min-height:280px; border-radius:0 0 24px 24px}
  .courses{max-width:980px; display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:20px 18px 0}
  .course{margin:0}
  .course .meta h2{font-size:18px}
  .more{max-width:980px; padding:8px 18px 0}
  .more details{padding:14px 18px}
  .family img{width:72px;height:72px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero" role="banner">
    <div class="hero-inner">
      <span class="badge">AI 办学小屋</span>
      <h1>五树杨的 AI 办学小屋</h1>
      <p class="hint">今晚主课 · 课程 3</p>
    </div>
  </header>

  <nav class="courses" aria-label="课程">
    <a class="course" href="shuyang-ai/learn/frame-anim.html">
      <span class="n">1</span>
      <span class="meta"><span class="tag">课程</span><h2>逐帧动画</h2></span>
      <span class="chev" aria-hidden="true">→</span>
    </a>
    <a class="course" href="shuyang-ai/learn/skeleton.html">
      <span class="n">2</span>
      <span class="meta"><span class="tag">课程</span><h2>3D 骨头人</h2></span>
      <span class="chev" aria-hidden="true">→</span>
    </a>
    <a class="course today" href="shuyang-ai/learn/cocos/visual-workbench.html">
      <span class="n">3</span>
      <span class="meta"><span class="tag">今晚主课</span><h2>可视化关卡工坊</h2></span>
      <span class="chev" aria-hidden="true">→</span>
    </a>
    <a class="course" href="hard/">
      <span class="n">4</span>
      <span class="meta"><span class="tag">预告</span><h2>螺丝拆拆乐</h2></span>
      <span class="chev" aria-hidden="true">→</span>
    </a>
  </nav>

  <section class="more">
    <details>
      <summary>一家人 · 说明与旁路</summary>
      <div class="family" aria-label="一家人">
        <figure><img src="shuyang-ai/avatars/dad-wuxin.jpg" alt="爸爸"><figcaption>爸爸</figcaption></figure>
        <figure><img src="shuyang-ai/avatars/mom-chunyan.jpg" alt="妈妈"><figcaption>妈妈</figcaption></figure>
        <figure><img src="shuyang-ai/avatars/xiaoyu.jpg" alt="小宇"><figcaption>小宇</figcaption></figure>
        <figure><img src="shuyang-ai/avatars/pengpeng.jpg" alt="五树杨"><figcaption>五树杨</figcaption></figure>
      </div>
      <p class="desc">海军蓝 · 金 · 绿一家风（与工坊同色板）。四门课一起长大；课程 4 螺丝拆拆乐 / 猜猜乐是以后的 3D，不当首页焦点。</p>
      <p class="links">
        <a href="shuyang-ai/learn/cocos/workbench.html?lesson=tonight">今晚基础台（备用）</a>
        <a href="shuyang-ai/learn/cocos/custom-play.html">试玩自定义关</a>
        <a href="index-screw.html">旧螺丝页</a>
        <a href="shuyang-ai/">旧冒险月</a>
      </p>
    </details>
  </section>
</div>
</body>
</html>
