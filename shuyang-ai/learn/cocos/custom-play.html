<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="../../../favicon.png" type="image/png"/>
  <link rel="apple-touch-icon" href="../../../apple-touch-icon.png"/>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1230">
<meta name="play-build" content="c54">
<title>玩我的关 · 伍澍暘成长屋</title>
<link rel="stylesheet" href="../../../brand-tokens.css"/>
<link rel="preload" as="image" href="../../../xy-go/sprites/green/idle.png" fetchpriority="high"/>
<link rel="preload" as="image" href="../../../xy-go/scenes/dirt-tile.png"/>
<link rel="preload" as="image" href="../../../xy-go/scenes/grass-cap.png"/>
<style>
:root{
  --navy:#0f1230; --navy2:#161b3d; --gold:#ffe07a; --gold2:#e6b422;
  --green:#3ecf6a; --green2:#2aa85a; --ink:#f4f0ff; --muted:#a8a0c8;
  --stroke:rgba(255,224,122,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy)}
body{
  font-family:var(--family-font,-apple-system,"PingFang SC","Noto Sans SC",sans-serif);
  color:var(--ink);height:100dvh;height:100vh;position:relative
}
/* —— 顶栏：与工坊 chip 同族 —— */
.bar{
  position:fixed;left:0;right:0;top:0;z-index:30;display:flex;gap:6px;padding:4px 8px;
  align-items:center;min-height:34px;pointer-events:none
}
.bar > *{pointer-events:auto}
.bar .chip{
  display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;
  background:rgba(15,18,48,.92);border:1px solid var(--stroke);border-radius:16px;
  padding:5px 10px;backdrop-filter:blur(6px);max-width:min(78vw,520px)
}
.bar a,.bar button.net{
  color:var(--green);font-weight:800;text-decoration:none;background:transparent;
  border:0;border-radius:999px;padding:3px 8px;font-size:12px;cursor:pointer;white-space:nowrap
}
.bar button.net{
  background:linear-gradient(180deg,var(--green),var(--green2));color:#083018;
  border:1px solid transparent;padding:5px 12px;box-shadow:0 2px 0 #1e6b3a
}
.bar button.net:active{transform:translateY(1px);box-shadow:none}
.bar h1{margin:0;font-size:13px;color:var(--gold);font-weight:900;line-height:1.3}
.badge{
  font-size:10px;font-weight:800;color:#0f1230;
  background:linear-gradient(180deg,var(--gold),var(--gold2));
  border-radius:999px;padding:3px 8px;margin-left:auto;flex-shrink:0
}
.castStrip{display:flex;gap:4px;align-items:center;margin-left:4px;flex-shrink:0}
.castStrip img{width:22px;height:22px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;background:var(--navy2)}
#orientTip{display:none;position:absolute;left:50%;transform:translateX(-50%);top:40px;z-index:12;font-size:11px;font-weight:800;color:#ffe7a0;background:#1a2048cc;padding:3px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;border:1px solid var(--stroke)}
#orientTip.on{display:block}

/* —— 外舞台：工坊同款海军径向 —— */
#stageOuter{
  position:fixed;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;
  padding:40px 8px 8px;
  background:radial-gradient(900px 480px at 50% 0%,#24306a 0%,var(--navy) 60%,#080a1c 100%)
}
/* 手机横屏金框壳（装饰；槽内仍全屏可玩） */
.phone-bezel{
  position:relative;width:min(100vw - 10px, calc((100vh - 44px) * 16 / 9 + 28px));
  height:calc(100vh - 44px);max-height:calc(100dvh - 44px);
  border-radius:26px;padding:7px 12px;
  background:linear-gradient(160deg,#1c2348,#0a0d22);
  border:2px solid var(--stroke);box-shadow:0 18px 40px rgba(0,0,0,.45);
  display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px
}
.phone-notch{
  flex:0 0 8px;width:8px;height:26%;border-radius:8px;background:#05070fcc;align-self:center
}
.canvas-slot{
  position:relative;flex:1 1 auto;min-width:0;min-height:0;width:auto;height:100%;
  max-width:calc(100% - 18px);border-radius:0;overflow:hidden;
  background:#0f1230;border:1px solid rgba(255,224,122,.2)
}
.shell{position:absolute;inset:0;z-index:0;width:100%;height:100%;background:#0f1230;display:block} /* c43: navy safety bed */
.cvwrap{position:absolute;inset:0;width:100%;height:100%;background:transparent;overflow:hidden;line-height:0}
#stagePad{position:absolute;inset:0;z-index:0;background:#0f1230;pointer-events:none;opacity:1} /* c43 */
/* c51: no border-radius on the WebGL clip parent — radius+overflow:hidden soft-composites canvas on mobile Safari/Chrome */
.canvas-slot{border-radius:0}
#gameCanvas,#Cocos2dGameContainer{-webkit-transform:translateZ(0);transform:translateZ(0)}
#gameCanvas{position:absolute;inset:0;z-index:1;width:100%!important;height:100%!important;display:block;background:transparent;touch-action:none;opacity:1;image-rendering:auto;-ms-interpolation-mode:bicubic}

/* HUD — schoolhouse navy/gold（舞台仍 canopy-night） */
.hud{position:absolute;top:8px;left:8px;right:8px;z-index:28;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
.lvlcard{background:#161b3dee;border-radius:12px;padding:7px 12px;min-width:132px;min-height:44px;border:1px solid rgba(255,224,122,.38);box-shadow:0 2px 10px #0007}
#lvlChip{display:block;font-size:14px;font-weight:900;color:#fff;line-height:1.3;min-height:18px;margin:0 0 5px;white-space:nowrap}
#hp{display:flex;align-items:center;gap:6px;min-height:14px}
#hp .hpchip{font-size:11px;font-weight:900;color:#0f1230;background:linear-gradient(180deg,#9ff0a8,#3ecf6a);border-radius:999px;padding:2px 7px;line-height:1.2}
#hp .hpbar{display:inline-block;width:84px;height:10px;background:#1a2040;border-radius:5px;overflow:hidden;vertical-align:middle;border:1px solid rgba(62,207,106,.45)}
#hp .hpbar i{display:block;height:100%;min-height:8px;background:linear-gradient(90deg,#2aa85a,#3ecf6a);width:100%}
#coins,#score,#weapon{font-size:14px;color:var(--gold);font-weight:800;text-shadow:0 1px 3px #000a;background:#161b3dee;border-radius:12px;padding:6px 10px;border:1px solid rgba(255,224,122,.32)}
#castPick{position:absolute;left:8px;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:29;display:flex;gap:6px;pointer-events:auto}
#castPick button{border:1px solid rgba(255,224,122,.4);border-radius:999px;padding:5px 10px;font-size:11px;font-weight:900;color:#ffe07a;background:#161b3dee;cursor:pointer}
#castPick button.on{background:linear-gradient(180deg,#3ecf6a,#2aa85a);color:#083018;border-color:transparent}
#castPick button:disabled{opacity:.45;cursor:not-allowed}
#bossBar{display:none;position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:28;background:#161b3dee;border-radius:12px;padding:6px 12px;min-width:200px;max-width:90%;pointer-events:none;border:1px solid #ff5a5a66}
#bossBar.on{display:block}
#bossBar .bn{font-size:13px;font-weight:800;color:#fff;margin:0 0 4px;text-align:center}
#bossBar .bb{height:8px;background:#3a1818;border-radius:4px;overflow:hidden}
#bossBar .bb i{display:block;height:100%;background:#ff5a5a;width:100%}
#msg{position:absolute;top:96px;left:0;right:0;z-index:28;text-align:center;font-weight:800;font-size:12px;color:#fff;text-shadow:0 1px 4px #000c;pointer-events:none;padding:0 8px}
#boot{display:none;position:absolute;inset:0;z-index:15;align-items:center;justify-content:center;text-align:center;font-size:15px;color:#ffe7a0;font-weight:800;background:#05070fcc;padding:16px}
#boot.err{display:flex;color:#ffb4b4}
#boot.show{display:flex}
#netBanner{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:11;font-size:12px;font-weight:800;background:#0f1230ee;color:#3ecf6a;padding:4px 12px;border-radius:999px;white-space:nowrap;border:1px solid rgba(255,224,122,.35)}
#netBanner.on{display:block}
#netPanel{display:none;position:fixed;inset:0;z-index:40;align-items:center;justify-content:center;background:rgba(8,10,20,.82);pointer-events:none}
#netPanel.on{display:flex;pointer-events:auto}
#netPanel .card{background:linear-gradient(180deg,#161b3d,#0f1230);border:2px solid rgba(255,224,122,.45);border-radius:16px;padding:16px 18px;text-align:center;max-width:92%;min-width:260px;box-shadow:0 16px 40px rgba(0,0,0,.45)}
#netPanel h2{margin:0 0 8px;font-size:18px;color:var(--gold)}
#netPanel p{margin:0 0 10px;font-size:13px;color:#c9c3ef;font-weight:700}
#netPanel .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.touch{position:absolute;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:space-between;gap:8px;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));user-select:none;pointer-events:none;background:transparent}
.touch .cluster{display:flex;gap:6px;pointer-events:auto}
.touch button{border:0;border-radius:14px;width:52px;height:52px;font-size:18px;font-weight:900;color:#fff;background:linear-gradient(180deg,#5a6ab0dd,#3b4590ee);box-shadow:0 3px 0 #2a3268;touch-action:none}
.touch button:active,.touch button.on{transform:translateY(2px);box-shadow:none;background:linear-gradient(180deg,#78d484,#4ea85c)}
.touch #btnJ{width:60px;background:linear-gradient(180deg,#ffb06bdd,#e2793bee);box-shadow:0 3px 0 #a35a20;font-size:14px}
.touch #btnT{width:60px;background:linear-gradient(180deg,#7ab0ffdd,#3b6fd4ee);box-shadow:0 3px 0 #274a8a;font-size:14px}
.dock{position:absolute;z-index:9;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.go{border:0;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:900;color:#083018;background:linear-gradient(180deg,var(--green),var(--green2));box-shadow:0 2px 0 #1e6b3a;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;min-height:40px}
.go.sec{background:linear-gradient(180deg,#3b4590,#24305f);color:#ffe07a;box-shadow:0 2px 0 #12162c;font-size:11px}
#fxCelebrate{display:none;position:absolute;inset:0;z-index:36;pointer-events:none;width:100%;height:100%}
#result{display:none;position:absolute;inset:0;z-index:35;align-items:center;justify-content:center;background:rgba(8,10,28,.75);line-height:normal}
#result.show{display:flex}
#result .card{background:linear-gradient(180deg,#161b3d,#0f1230);border:2px solid rgba(255,224,122,.5);border-radius:18px;padding:16px 18px;text-align:center;max-width:92%;line-height:1.4}
#result .big{font-size:26px;font-weight:900;margin:0 0 10px;line-height:1.3;display:block}
#result .sub{font-size:13px;color:#c9c3ef;font-weight:800;margin:0 0 12px;line-height:1.5;display:block}
#result .sub .sub-hp,#result .sub .sub-hint,#result .sub .stat-row{display:block;margin:0 0 6px;line-height:1.5}
#result .sub .stat-row{font-size:16px;font-weight:900;color:#e8e4ff}
#result .sub .stat-row b{font-size:20px}
#result .ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* c31：竖屏成片铺满 + 底栏完整可见；横屏金框壳不动 */
@media (orientation:portrait){
  #orientTip.on{display:block}
  #stageOuter{
    /* 顶给顶栏，底留安全区；flex 子项吃满剩余，避免 100vh 高出可视区裁掉底栏 */
    padding:32px 0 max(10px, env(safe-area-inset-bottom, 0px));
    align-items:stretch;justify-content:stretch;flex-direction:column;
    background:#0f1230; /* c43: 冷开跟壳海军，土带由关内 dirt 画 */
  }
  .phone-bezel{
    flex:1 1 auto;flex-direction:column;width:100%;
    height:auto;min-height:0;max-height:none;
    border-radius:0;padding:0;gap:0;border:0;box-shadow:none;
    background:transparent
  }
  .phone-notch{display:none}
  .canvas-slot{
    width:100%;height:100%;flex:1 1 auto;aspect-ratio:auto;min-height:0;
    max-height:none;max-width:100%;border-radius:0;border:0;background:#0f1230
  }
  .bar{min-height:28px;padding:2px 6px}
  .bar .chip{padding:3px 8px;border-radius:14px;max-width:calc(100vw - 100px)}
  .bar a,.bar button.net{padding:3px 8px;font-size:11px}
  .bar h1{font-size:12px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{display:none}
  /* 底栏：加大上下垫，键+阴影完整落在槽内（安全区已由 #stageOuter 吃） */
  .touch{padding:10px 12px 14px;gap:8px;align-items:flex-end}
  .touch button{width:48px;height:48px;font-size:16px;border-radius:12px}
  .touch #btnJ,.touch #btnT{width:56px;font-size:13px}
  #castPick{bottom:76px} /* 抬到更高触控带之上 */
  .hud{top:6px}.lvlcard{min-height:36px;padding:5px 8px;min-width:110px}#lvlChip{font-size:12px;margin:0 0 3px}#bossBar{top:52px}#msg{top:82px;font-size:11px}
  .go{padding:8px 14px;font-size:14px;min-height:36px}
}
/* 触屏窄机（含横屏）仍缩键，但不改壳槽比例；竖屏底垫交给上面 portrait 块，勿再压回 4px */
@media (pointer:coarse) and (max-width:900px){
  .touch{padding:4px 10px calc(4px + env(safe-area-inset-bottom,0px));gap:6px}
  .touch button{width:48px;height:48px;font-size:16px;border-radius:12px}
  .touch #btnJ,.touch #btnT{width:56px;font-size:13px}
}
@media (orientation:portrait) and (pointer:coarse) and (max-width:900px){
  .touch{padding:10px 12px 14px;gap:8px;align-items:flex-end}
  #castPick{bottom:76px}
}
@media (orientation:landscape),(max-height:480px){
  #orientTip{display:none!important}
  #stageOuter{padding:34px 4px 4px}
  .phone-bezel{
    width:min(100vw - 8px, calc((100vh - 28px) * 16 / 9 + 34px));
    height:calc(100vh - 28px);max-height:calc(100dvh - 28px);
    padding:7px 12px;border-radius:26px
  }
  .bar{min-height:26px;padding:2px 6px}.bar h1{font-size:12px}.badge{display:none}
  .bar .chip{padding:3px 7px;font-size:11px;border-radius:12px}
  .touch{background:transparent;padding:4px 10px calc(4px + env(safe-area-inset-bottom,0px))}
  .touch button{width:44px;height:44px;font-size:16px}.touch #btnJ,.touch #btnT{width:52px;font-size:12px}
  .hud{top:6px}#msg{font-size:11px;top:78px}#bossBar{top:48px}
}
/* 宽屏桌面：金框铺满可用区，不缩成小手机 */
@media (min-width:900px) and (min-height:520px),(hover:hover) and (pointer:fine) and (min-width:800px){
  #stageOuter{padding:42px 12px 12px}
  .phone-bezel{
    width:min(96vw,1100px);height:calc(100vh - 52px);max-height:calc(100dvh - 52px);
    border-radius:22px;padding:10px 14px;flex-direction:row
  }
  .phone-notch{display:none}
  .canvas-slot{max-width:100%;border-radius:0}
  .touch{padding:8px 16px 12px;background:transparent;gap:6px}
  .touch button{width:42px;height:42px;font-size:14px;border-radius:11px}
  .touch #btnJ,.touch #btnT{width:50px;font-size:12px}
  .bar a,.bar button.net{padding:3px 8px;font-size:11px}
  .dock{top:auto;bottom:66px;right:12px}
  .go{padding:8px 14px;font-size:13px;min-height:32px}
}
</style>
<script>document.ccConfig={debugMode:0,frameRate:60,id:"gameCanvas",renderMode:1,showFPS:false};</script>
</head>
<body>
<div class="bar">
  <div class="chip">
    <h1>🎮 伍澍暘 · 玩我的关 · 小宇</h1>
    <a id="backWb" href="visual-workbench.html?v=ldt36&amp;step=2">← 回工坊</a>
    <a id="backEdit" href="visual-workbench.html?v=ldt36&amp;step=2">回编辑器</a>
    <button class="net" id="btnNet" type="button">🤝 联机游玩</button>
  </div>
  <span class="badge">Cocos</span>
  <span class="castStrip" id="castStrip" title="仅绿/红/蓝三忍者">
    <img data-src="../../../xy-go/ninjas/ninja-green.jpg" alt="绿忍者" width="22" height="22"/>
    <img data-src="../../../xy-go/ninjas/ninja-blue.jpg" alt="蓝忍者" width="22" height="22"/>
    <img data-src="../../../xy-go/ninjas/ninja-red.jpg" alt="红忍者" width="22" height="22"/>
  </span>
</div>
<div id="orientTip">📱 竖屏可玩 · 比例同横屏</div>
<div id="stageOuter">
  <div class="phone-bezel" id="playBezel">
    <div class="phone-notch" aria-hidden="true"></div>
    <div class="canvas-slot" id="playSlot">
      <div class="shell" id="shell">
        <div class="cvwrap" id="cvwrap">
          <div id="stagePad" aria-hidden="true"></div>
          <canvas id="gameCanvas" width="640" height="520"></canvas>
          <div id="boot"></div>
          <div id="netBanner"></div>
          <div class="hud">
            <div class="lvlcard">
              <div id="lvlChip">第9关 我的关卡</div>
              <div id="hp"><span class="hpchip">A 绿</span><span class="hpbar"><i style="width:100%"></i></span></div>
            </div>
            <div id="coins">🪙 0</div>
            <div id="score">积分 0</div>
            <div id="weapon" title="点击切换 弓/锤子/飞镖">武器 飞镖</div>
          </div>
          <div id="bossBar"><div class="bn">鳄鱼王</div><div class="bb"><i style="width:100%"></i></div></div>
          <div id="msg">←→移动 · 跳 · L投 · 打鳄王</div>
          <div class="dock">
            <button class="go" id="retry" type="button">重来</button>
          </div>
          <canvas id="fxCelebrate" aria-hidden="true"></canvas>
          <div id="result" aria-live="polite">
            <div class="card">
              <p class="big" id="resultBig">过关！</p>
              <p class="sub" id="resultSub"></p>
              <div class="ctl">
                <button type="button" class="go" id="again">再玩一次</button>
                <a class="go sec" href="visual-workbench.html?v=ldt36&amp;step=2">回编辑器再调</a>
              </div>
            </div>
          </div>
          <div class="touch" id="touch">
            <div class="cluster">
              <button type="button" id="btnL" aria-label="左">◀</button>
              <button type="button" id="btnR" aria-label="右">▶</button>
            </div>
            <div class="cluster">
              <button type="button" id="btnJ" aria-label="跳">跳</button>
              <button type="button" id="btnT" aria-label="投">投</button>
            </div>
          </div>
          <div id="castPick" aria-label="选忍者（仅绿红蓝）">
            <button type="button" data-skin="green">绿</button>
            <button type="button" data-skin="blue">蓝</button>
            <button type="button" data-skin="red">红</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="netPanel">
  <div class="card">
    <h2>🤝 联机游玩</h2>
    <p id="netWait">PeerJS 自动匹配队友…</p>
    <div class="row">
      <button class="go" id="netStart" type="button" style="display:none">开始游戏</button>
      <button class="go sec" id="netCancel" type="button">取消</button>
    </div>
  </div>
</div>
<!-- c54: 试玩跟编辑器背景 · was c53: 五关弧线 -->
<script src="../../../vendor/peerjs/peerjs.min.js"></script>
<script src="../../../vendor/cocos2d-html5/cocos2d-js-v3.13-lite.js"></script>

<script>
(function () {
  try {
    var q = new URLSearchParams(location.search);
    var n = parseInt(q.get('scene') || '', 10);
    if (!(n >= 1 && n <= 5)) return;
    var href = 'visual-workbench.html?v=ldt36&step=2&scene=' + n;
    ['backWb', 'backEdit'].forEach(function (id) {
      var a = document.getElementById(id);
      if (a) a.setAttribute('href', href);
    });
  } catch (e) {}
})();
</script>
