<!DOCTYPE html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="wb-build" content="wb5">
<title>学习工作台 · 今晚四步</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0f1230}
body{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
#gameCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0f1230;touch-action:none}
#boot{display:none;position:fixed;inset:0;z-index:5;align-items:center;justify-content:center;text-align:center;font-size:18px;font-weight:800;color:#ffe7a0;background:#05070fcc;padding:16px}
#boot.show{display:flex}
#boot.err{display:flex;color:#ffb4b4}
@media (max-width:720px){
  #boot{font-size:16px;padding:20px}
}
</style>
<script>document.ccConfig={debugMode:0,frameRate:60,id:"gameCanvas",renderMode:1,showFPS:false};</script>
</head>
<body>
<canvas id="gameCanvas" width="960" height="540"></canvas>
<div id="boot" class="show">正在打开课件…</div>
<!-- wb5: failsafe clears sticky boot if asset tick never finishes -->
<script>
(function(){
  var cleared=false;
  function clearBoot(msg,err){
    if(cleared&&!err)return;
    var b=document.getElementById('boot');
    if(!b)return;
    if(err){b.textContent=msg||'打开失败，请刷新';b.className='err';return;}
    if(!msg){cleared=true;b.textContent='';b.className='';}
  }
  window.__wbClearBoot=clearBoot;
  setTimeout(function(){
    var b=document.getElementById('boot');
    if(b&&(b.className.indexOf('show')>=0||b.className.indexOf('err')>=0)&&b.textContent.indexOf('正在打开')>=0){
      clearBoot();
    }
  },9000);
})();
</script>
<!-- wb1: cocos after the canvas exists. Lite _initSys on phones calls document.body.appendChild; a head script aborts. -->
<script src="../../../vendor/cocos2d-html5/cocos2d-js-v3.13-lite.js"></script>
<script src="wb-store.js?v=wb5"></script>
<script src="wb-art.js?v=wb5"></script>
<script src="workbench.js?v=wb5"></script>
</body>
</html>
