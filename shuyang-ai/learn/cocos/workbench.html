<style>
:root{
  --navy:#0f1230; --navy2:#161b3d; --gold:#ffe07a; --gold2:#e6b422;
  --green:#3ecf6a; --ink:#f4f0ff; --muted:#a8a0c8; --stroke:rgba(255,224,122,.32);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 480px at 50% 0%,#24306a 0%,var(--navy) 60%,#080a1c 100%);
  padding:56px 8px 8px}
#shell{position:relative;width:min(100vw,1100px);height:min(100%,720px);max-height:calc(100vh - 64px);display:flex;
  align-items:center;justify-content:center;gap:10px;padding:0}
#shell.phone .phone-bezel{display:flex}
#shell.desktop .phone-bezel{display:none}
.phone-bezel{display:none;width:min(96vw,504px);height:min(calc(100vh - 72px),912px);max-height:100%;border-radius:43px;
  padding:12px 10px 16px;background:linear-gradient(160deg,#1c2348,#0a0d22);
  border:2px solid var(--stroke);box-shadow:0 18px 40px rgba(0,0,0,.45);flex-direction:column;
  justify-content:center;align-items:stretch;gap:8px}
.phone-notch{flex:0 0 auto;height:14px;margin:0 auto 6px;width:38%;border-radius:0 0 12px 12px;background:#05070fcc}
.canvas-slot{position:relative;flex:0 0 auto;min-height:0;min-width:0;border-radius:16px;overflow:hidden;
  background:#0f1230;border:1px solid rgba(255,224,122,.2)}
/* Phone stage stays 16:9 inside the tall bezel — no giant empty letterbox */
.phone-bezel .canvas-slot{width:100%;height:auto;aspect-ratio:16/9;max-height:calc(100% - 28px)}
#shell.desktop #desktopSlot{display:block;flex:0 0 auto;width:min(96vw,960px,calc((100vh - 72px) * 16 / 9));
  height:auto;aspect-ratio:16/9;max-height:min(82vh,540px);border-radius:18px;
  box-shadow:0 16px 40px rgba(0,0,0,.4);border:1px solid var(--stroke)}
#shell.phone #desktopSlot{display:none!important}
/* Keep Cocos host inside the slot — never viewport-fixed */
#Cocos2dGameContainer{position:absolute!important;left:0!important;top:0!important;right:auto!important;bottom:auto!important;
  margin:0!important;transform:none!important;-webkit-transform:none!important;box-sizing:border-box;overflow:hidden}
#gameCanvas{position:absolute!important;left:0!important;top:0!important;right:auto!important;bottom:auto!important;
  margin:0!important;display:block;background:#0f1230;touch-action:none}
#boot{display:none;position:absolute;inset:0;z-index:5;align-items:center;justify-content:center;
  text-align:center;font-size:17px;font-weight:800;color:#ffe7a0;background:#05070fcc;padding:16px}
#boot.show{display:flex}#boot.err{display:flex;color:#ffb4b4}
#topbar{position:fixed;left:0;right:0;top:0;z-index:15;display:flex;align-items:flex-start;
  justify-content:space-between;gap:8px;padding:6px 10px;pointer-events:none}
#topbar > *{pointer-events:auto}
.chip{background:rgba(15,18,48,.88);border:1px solid var(--stroke);border-radius:16px;
  padding:6px 10px;font-size:12px;font-weight:800;color:var(--gold);backdrop-filter:blur(6px);
  max-width:min(70vw,420px);line-height:1.35;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.chip a{color:var(--green);text-decoration:none;white-space:nowrap}
.shell-toggle{display:flex;gap:6px;flex-shrink:0}
.shell-toggle button{border:1px solid var(--stroke);background:var(--navy2);color:var(--ink);
  border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.shell-toggle button.on{background:var(--green);color:#062014;border-color:transparent}
/* Portrait phone: bezel hugs 16:9 stage */
.phone-bezel{height:auto;max-height:calc(100vh - 72px)}
.phone-bezel .canvas-slot{width:min(100%,calc((100vh - 110px) * 16 / 9));margin:0 auto;max-height:calc(100vh - 110px)}
@media (max-width:720px){
  #stage{padding:52px 4px 4px}
  #shell{max-height:calc(100vh - 56px);height:auto;min-height:0}
  .phone-bezel{width:min(100vw - 8px,504px);height:auto;max-height:calc(100vh - 56px);border-radius:34px;padding:10px 8px 12px}
  #shell.desktop #desktopSlot{width:min(100%,calc((100vh - 120px) * 16 / 9));height:auto;aspect-ratio:16/9;
    max-height:min(70vh,calc(100vh - 120px))}
  .phone-bezel .canvas-slot{width:100%;max-height:calc(100vh - 100px)}
  .chip{font-size:11px;padding:5px 8px;max-width:calc(100vw - 130px);border-radius:14px}
  .shell-toggle button{padding:5px 8px;font-size:11px}
}
@media (orientation:landscape) and (max-height:520px){
  #stage{padding:34px 4px 4px;align-items:center}
  #topbar{padding:2px 6px}
  .chip{font-size:10px;padding:3px 7px;max-width:calc(100vw - 150px);border-radius:12px;gap:2px 6px}
  .shell-toggle button{padding:4px 7px;font-size:10px}
  #shell{width:100%;height:calc(100vh - 38px);max-height:calc(100vh - 38px)}
  .phone-bezel{
    flex-direction:row;align-items:center;justify-content:center;
    width:min(100vw - 8px, calc((100vh - 28px) * 16 / 9 + 34px));
    height:calc(100vh - 28px);max-height:calc(100vh - 28px);
    padding:7px 12px;border-radius:26px;gap:8px
  }
  .phone-notch{width:8px;height:26%;margin:0;border-radius:8px;flex:0 0 8px}
  .phone-bezel .canvas-slot{
    flex:1 1 auto;width:auto;height:100%;max-height:100%;
    aspect-ratio:16/9;max-width:calc(100% - 18px);margin:0
  }
  #shell.desktop #desktopSlot{
    width:min(100vw - 12px, calc((100vh - 46px) * 16 / 9));
    height:auto;max-height:calc(100vh - 46px);aspect-ratio:16/9
  }
}
</style>
<script>document.ccConfig={debugMode:0,frameRate:60,id:"gameCanvas",renderMode:1,showFPS:false};</script>

    <div class="phone-bezel">
      <div class="phone-notch"></div>
      <div class="canvas-slot">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <div id="boot" class="show">正在打开课件…</div>
      </div>
    </div>

      <!-- canvas moves here in desktop mode via JS -->

<!-- ldt32: play tip→c48 链 · was ldt31: §8 电凹大箱真可摆 · was ldt29 灰显 · was ldt19 闸门藏二级 · wb83/wb82/wb81/wb79 -->
<script>
(function(){
  var cleared=false;
  function clearBoot(msg,err){
    if(cleared&&!err)return;
    var b=document.getElementById('boot');
    if(!b)return;
    if(err){cleared=false;b.textContent=msg||'打开失败，请刷新';b.className='err';return;}
    if(msg){b.textContent=msg;b.className='show';return;}
    cleared=true;b.textContent='';b.className='';
  }
  window.__wbClearBoot=clearBoot;
  function canvasLooksEmpty(){
    var c=document.getElementById('gameCanvas');
    if(!c)return true;
    var r=c.getBoundingClientRect();
    if(r.width<40||r.height<40)return true;
    if(r.bottom<=0||r.top>=(window.innerHeight||0))return true;
    return false;
  }
  setTimeout(function(){
    var b=document.getElementById('boot');
    if(!b)return;
    var sticky=b.className.indexOf('show')>=0&&(b.textContent.indexOf('正在打开')>=0);
    if(sticky||canvasLooksEmpty()){
      if(window.__wbFitCanvas){try{window.__wbFitCanvas(true);}catch(e){}}
      try{window.dispatchEvent(new Event('resize'));}catch(e2){}
      setTimeout(function(){
        var b2=document.getElementById('boot');
        if(!b2)return;
        if(canvasLooksEmpty()){
          clearBoot('课件还没画进画框，点刷新或切换电脑壳/手机壳再试',true);
        }else if(b2.textContent.indexOf('正在打开')>=0){
          clearBoot();
        }
      },500);
    }
  },9000);
})();
</script>
<script src="../../../vendor/cocos2d-html5/cocos2d-js-v3.13-lite.js"></script>

<script>
(function () {
  var shell = document.getElementById('shell');
  var canvas = document.getElementById('gameCanvas');
  var boot = document.getElementById('boot');
  var phoneSlot = shell.querySelector('.phone-bezel .canvas-slot');
  var deskSlot = document.getElementById('desktopSlot');

  function activeHost() {
    return document.getElementById('Cocos2dGameContainer') || canvas;
  }

  function placeCanvas(mode) {
    shell.className = mode;
    var slot = mode === 'phone' ? phoneSlot : deskSlot;
    var host = activeHost();
    if (host && host.parentNode !== slot) slot.appendChild(host);
    var cont = document.getElementById('Cocos2dGameContainer');
    if (cont && canvas.parentNode !== cont) cont.appendChild(canvas);
    if (boot.parentNode !== slot) slot.appendChild(boot);
    try { localStorage.setItem('wb-shell', mode); } catch (e) {}
    window.__wbShell = mode;
    document.querySelectorAll('#shellToggle button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-shell') === mode);
    });
    if (window.WB && typeof WB.setShell === 'function') {
      try { WB.setShell(mode); } catch (e3) {}
    }
    if (window.__wbFitCanvas) {
      try { window.__wbFitCanvas(true); } catch (e4) {}
    }
    try { window.dispatchEvent(new Event('resize')); } catch (e2) {}
  }
  window.__wbPlaceCanvas = placeCanvas;
  function isNarrowViewport() {
    try {
      var w = window.innerWidth || 0, h = window.innerHeight || 0;
      return w <= 520 || (w < 720 && h > w);
    } catch (e0) { return false; }
  }
  function preferShell() {
    /* P1: narrow portrait always opens 手机壳 (ignore stale desktop localStorage) */
    if (isNarrowViewport()) return 'phone';
    try {
      var s = localStorage.getItem('wb-shell');
      if (s === 'phone' || s === 'desktop') return s;
    } catch (e) {}
    try {
      if (window.innerWidth < 720 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || '')) return 'phone';
    } catch (e2) {}
    return 'desktop';
  }
  placeCanvas(preferShell());
  document.getElementById('shellToggle').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-shell]');
    if (!b) return;
    placeCanvas(b.getAttribute('data-shell'));
  });
})();
</script>
