<!DOCTYPE html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1230">
<meta name="wb-build" content="wb6">
<title>学习工作台 · 今晚四步 · 五树杨</title>
<style>
:root{
  --navy:#0f1230; --navy2:#161b3d; --gold:#ffe07a; --gold2:#e6b422;
  --green:#3ecf6a; --ink:#f4f0ff; --muted:#a8a0c8; --stroke:rgba(255,224,122,.32);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);
  font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 480px at 50% 0%,#24306a 0%,var(--navy) 60%,#080a1c 100%);
  padding-top:48px}
#shell{position:relative;width:min(100vw,1100px);height:min(100vh - 48px,720px);display:flex;
  align-items:center;justify-content:center;gap:10px;padding:8px}
#shell.phone .phone-bezel{display:flex}
#shell.desktop .phone-bezel{display:none}
.phone-bezel{display:none;width:min(96vw,420px);height:min(86vh,760px);border-radius:36px;
  padding:14px 10px 18px;background:linear-gradient(160deg,#1c2348,#0a0d22);
  border:2px solid var(--stroke);box-shadow:0 18px 40px rgba(0,0,0,.45);flex-direction:column}
.phone-notch{height:18px;margin:0 auto 6px;width:38%;border-radius:0 0 12px 12px;background:#05070fcc}
.canvas-slot{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;
  background:#0f1230;border:1px solid rgba(255,224,122,.2)}
#shell.desktop .canvas-slot{width:min(96vw,960px);height:min(82vh,540px);border-radius:18px;
  box-shadow:0 16px 40px rgba(0,0,0,.4);border:1px solid var(--stroke)}
#gameCanvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;
  background:#0f1230;touch-action:none}
#boot{display:none;position:absolute;inset:0;z-index:5;align-items:center;justify-content:center;
  text-align:center;font-size:17px;font-weight:800;color:#ffe7a0;background:#05070fcc;padding:16px}
#boot.show{display:flex}#boot.err{display:flex;color:#ffb4b4}
#topbar{position:fixed;left:0;right:0;top:0;z-index:15;display:flex;align-items:center;
  justify-content:space-between;gap:8px;padding:8px 12px;pointer-events:none}
#topbar > *{pointer-events:auto}
.chip{background:rgba(15,18,48,.88);border:1px solid var(--stroke);border-radius:999px;
  padding:6px 12px;font-size:12px;font-weight:800;color:var(--gold);backdrop-filter:blur(6px)}
.chip a{color:var(--green);margin-left:8px;text-decoration:none}
.shell-toggle{display:flex;gap:6px}
.shell-toggle button{border:1px solid var(--stroke);background:var(--navy2);color:var(--ink);
  border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}
.shell-toggle button.on{background:var(--green);color:#062014;border-color:transparent}
@media (max-width:720px){
  #stage{padding-top:44px}
  #shell.desktop .canvas-slot{width:100vw;height:auto;aspect-ratio:16/9;max-height:70vh}
  .chip{font-size:11px;padding:5px 10px}
}
</style>
<script>document.ccConfig={debugMode:0,frameRate:60,id:"gameCanvas",renderMode:1,showFPS:false};</script>
</head>
<body>
<div id="topbar">
  <div class="chip">🏡 五树杨 · 今晚工作台
    <a href="../../../index.html">回小屋</a>
    <a href="visual-workbench.html">可视化工坊</a>
  </div>
  <div class="shell-toggle" id="shellToggle">
    <button type="button" data-shell="desktop" class="on">电脑壳</button>
    <button type="button" data-shell="phone">手机壳</button>
  </div>
</div>

<div id="stage">
  <div id="shell" class="desktop">
    <div class="phone-bezel">
      <div class="phone-notch"></div>
      <div class="canvas-slot">
        <canvas id="gameCanvas" width="960" height="540"></canvas>
        <div id="boot" class="show">正在打开课件…</div>
      </div>
    </div>
    <div class="canvas-slot" id="desktopSlot">
      <!-- canvas moves here in desktop mode via JS -->
    </div>
  </div>
</div>

<!-- wb6: failsafe clears sticky boot if asset tick never finishes -->
<script>
(function(){
  var cleared=false;
  function clearBoot(msg,err){
    if(cleared&&!err)return;
    var b=document.getElementById('boot');
    if(!b)return;
    if(err){b.textContent=msg||'打开失败，请刷新';b.className='err';return;}
    if(!msg){cleared=true;b.textContent='';b.className='';}
  }
  window.__wbClearBoot=clearBoot;
  setTimeout(function(){
    var b=document.getElementById('boot');
    if(b&&(b.className.indexOf('show')>=0||b.className.indexOf('err')>=0)&&b.textContent.indexOf('正在打开')>=0){
      clearBoot();
    }
  },9000);
})();
</script>
<!-- cocos after canvas exists; Lite _initSys on phones appends to body -->
<script src="../../../vendor/cocos2d-html5/cocos2d-js-v3.13-lite.js"></script>
<script src="wb-store.js?v=wb6"></script>
<script src="wb-art.js?v=wb6"></script>
<script src="wb-audio.js?v=wb6"></script>
<script src="workbench.js?v=wb6"></script>
<script>
(function () {
  var shell = document.getElementById('shell');
  var canvas = document.getElementById('gameCanvas');
  var boot = document.getElementById('boot');
  var phoneSlot = shell.querySelector('.phone-bezel .canvas-slot');
  var deskSlot = document.getElementById('desktopSlot');

  function placeCanvas(mode) {
    shell.className = mode;
    var slot = mode === 'phone' ? phoneSlot : deskSlot;
    if (canvas.parentNode !== slot) {
      slot.appendChild(canvas);
      slot.appendChild(boot);
    }
    deskSlot.style.display = mode === 'desktop' ? 'block' : 'none';
    try { localStorage.setItem('wb-shell', mode); } catch (e) {}
    window.__wbShell = mode;
    document.querySelectorAll('#shellToggle button').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-shell') === mode);
    });
    if (window.WB && typeof WB.setShell === 'function') {
      try { WB.setShell(mode); } catch (e3) {}
    }
    try { window.dispatchEvent(new Event('resize')); } catch (e2) {}
  }
  var saved = 'desktop';
  try {
    saved = localStorage.getItem('wb-shell') ||
      ((window.innerWidth < 720 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || '')) ? 'phone' : 'desktop');
  } catch (e) {}
  placeCanvas(saved === 'phone' ? 'phone' : 'desktop');
  document.getElementById('shellToggle').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-shell]');
    if (!b) return;
    placeCanvas(b.getAttribute('data-shell'));
  });
})();
</script>
</body>
</html>
