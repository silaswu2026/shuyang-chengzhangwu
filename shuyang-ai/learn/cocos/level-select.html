<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="../../../favicon.png" type="image/png"/>
  <link rel="apple-touch-icon" href="../../../apple-touch-icon.png"/>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0f1230"/>
  <meta name="level-select-build" content="ls2"/>
  <title>选关 · 伍澍暘成长屋</title>
  <link rel="stylesheet" href="../../../brand-tokens.css"/>
  <style>
    :root{
      --navy:#0f1230; --navy2:#161b3d; --gold:#ffe07a; --gold2:#e6b422;
      --green:#3ecf6a; --green2:#2aa85a; --ink:#f4f0ff; --muted:#a8a0c8;
      --stroke:rgba(255,224,122,.32);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--navy);color:var(--ink);
      font-family:var(--family-font,-apple-system,"PingFang SC","Noto Sans SC",sans-serif)}
    body{
      min-height:100dvh;
      background:radial-gradient(900px 480px at 50% 0%,#24306a 0%,var(--navy) 60%,#080a1c 100%);
      padding:calc(12px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
    }
    .wrap{max-width:720px;margin:0 auto}
    .bar{
      display:flex;flex-wrap:wrap;gap:8px;align-items:center;
      background:rgba(15,18,48,.92);border:1px solid var(--stroke);border-radius:16px;
      padding:8px 12px;margin-bottom:14px;backdrop-filter:blur(6px)
    }
    .bar h1{margin:0;font-size:15px;color:var(--gold);font-weight:900;flex:1 1 auto}
    .bar a{
      color:var(--green);font-weight:800;text-decoration:none;font-size:12px;
      padding:4px 10px;border-radius:999px;border:1px solid rgba(62,207,106,.35)
    }
    .bar a:active{transform:translateY(1px)}
    .lead{margin:0 0 12px;font-size:13px;line-height:1.5;color:var(--muted);font-weight:700}
    .lead b{color:var(--gold)}
    .grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px
    }
    .card{
      display:flex;flex-direction:column;gap:6px;min-height:108px;
      background:linear-gradient(180deg,var(--navy2),#12162e);
      border:1px solid var(--stroke);border-radius:16px;padding:12px 12px 10px;
      box-shadow:0 8px 20px #0005;text-decoration:none;color:inherit;
      position:relative
    }
    .card .n{
      width:28px;height:28px;border-radius:10px;display:grid;place-items:center;
      font-weight:900;font-size:13px;background:#0a0d22;color:var(--gold);
      border:1px solid var(--gold2)
    }
    .card .name{font-size:14px;font-weight:900;line-height:1.25;margin:0}
    .card .boss{margin:0;font-size:12px;color:var(--muted);font-weight:700}
    .card .st{
      margin-top:auto;align-self:flex-start;font-size:11px;font-weight:900;
      border-radius:999px;padding:3px 8px
    }
    .card.playable{
      border-color:rgba(62,207,106,.55);
      box-shadow:0 8px 24px rgba(62,207,106,.18);
      cursor:pointer
    }
    .card.playable .n{
      background:linear-gradient(135deg,var(--green2),var(--green));color:#062014;border:none
    }
    .card.playable .st{
      background:linear-gradient(180deg,var(--green),var(--green2));color:#083018
    }
    .card.soon{opacity:.78;cursor:default}
    .card.soon .st{background:#2a3058;color:#c9c3ef;border:1px solid #ffffff18}
    .card.soon .flash{
      display:none;position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
      font-size:11px;font-weight:900;color:var(--gold);background:#0f1230ee;
      border:1px solid var(--stroke);border-radius:999px;padding:3px 10px;white-space:nowrap
    }
    .card.soon.show-flash .flash{display:block}
    .foot{
      margin:16px 0 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center
    }
    .foot a,.foot button{
      appearance:none;border:1px solid var(--stroke);background:#161b3dee;color:var(--gold);
      font-weight:800;font-size:12px;border-radius:999px;padding:8px 12px;cursor:pointer;
      text-decoration:none
    }
    .foot a.primary, .foot button.primary{
      background:linear-gradient(180deg,var(--green),var(--green2));color:#083018;border-color:transparent;
      box-shadow:0 2px 0 #1e6b3a
    }
    .note{margin:10px 0 0;font-size:11px;color:var(--muted);line-height:1.45;font-weight:600}
    @media (orientation:landscape) and (max-height:520px){
      body{padding:8px 10px}
      .bar{padding:5px 10px;margin-bottom:8px}
      .bar h1{font-size:13px}
      .lead{font-size:12px;margin-bottom:8px}
      .grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
      .card{min-height:88px;padding:8px 10px}
      .card .name{font-size:12px}
      .card .boss{font-size:11px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <h1>🗺️ 选关 · 伍澍暘 · 小宇</h1>
      <a href="../../../index.html">回小屋</a>
      <a href="visual-workbench.html?v=ldt32">工坊</a>
    </header>
    <p class="lead" id="lead">先试 <b>1–4</b>；试过后，点任意关<strong>一下</strong>就进关。第 <b>9</b> 关是「我的关卡」。</p>
    <div class="grid" id="grid" aria-label="关卡 1 到 9"></div>
    <div class="foot">
      <a class="primary" id="play9" href="custom-play.html?v=c51&amp;level=9">玩第9关 · 我的关卡</a>
      <a href="custom-play.html?v=c51&amp;level=9&amp;net=1">第9关联机</a>
      <a href="visual-workbench.html?v=ldt32">去工坊摆关</a>
    </div>
    <p class="note" id="note">加载名册…</p>
  </div>
  <script>
  (function () {
    var PLAY = 'custom-play.html?v=c51';
    var PROG_KEY = 'sycocos-level-progress';
    /* 试完规则（DESIGN）：L1–L4 各至少进过一次试玩页即算试过；
       若有过关 completed 戳也算。解锁后点任一关直达，无二次确认。 */
    var FALLBACK = [
      { n: 1, name: '林间晨跑', bossName: '熊大王' },
      { n: 2, name: '苔岩小径', bossName: '野猪' },
      { n: 3, name: '萤火树冠', bossName: '影忍者' },
      { n: 4, name: '尖刺走廊', bossName: '刺甲虫' },
      { n: 5, name: '火焰栈道', bossName: '炎猪' },
      { n: 6, name: '雷鸣谷口', bossName: '雷影' },
      { n: 7, name: '炸弹矿坑', bossName: '矿霸' },
      { n: 8, name: '终极融合', bossName: '终焉影' }
    ];
    var grid = document.getElementById('grid');
    var note = document.getElementById('note');
    var lead = document.getElementById('lead');

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }

    function loadProgress() {
      try {
        var raw = JSON.parse(localStorage.getItem(PROG_KEY) || '{}');
        return {
          tried: (raw && raw.tried && typeof raw.tried === 'object') ? raw.tried : {},
          completed: (raw && raw.completed && typeof raw.completed === 'object') ? raw.completed : {}
        };
      } catch (e) {
        return { tried: {}, completed: {} };
      }
    }

    function levelDone(prog, n) {
      var k = String(n);
      /* prefer completed stamp when present; else entered-once */
      return !!(prog.completed[k] || prog.tried[k]);
    }

    function gate14Open(prog) {
      for (var i = 1; i <= 4; i++) {
        if (!levelDone(prog, i)) return false;
      }
      return true;
    }

    function playHref(n) {
      return PLAY + '&level=' + (n | 0);
    }

    function render(levels) {
      var prog = loadProgress();
      var unlocked = gate14Open(prog);
      var html = '';
      for (var i = 0; i < levels.length; i++) {
        var lv = levels[i];
        var n = lv.n | 0;
        var done = levelDone(prog, n);
        var open = unlocked || n <= 4;
        if (open) {
          var st = done ? '已试 · 再玩' : (n <= 4 ? '可玩 · 进试玩' : '可玩 · 一点进关');
          html +=
            '<a class="card playable" href="' + playHref(n) + '" data-level="' + n + '">' +
              '<span class="n">' + n + '</span>' +
              '<p class="name">' + esc(lv.name) + '</p>' +
              '<p class="boss">Boss · ' + esc(lv.bossName || '待定') + '</p>' +
              '<span class="st">' + st + '</span>' +
            '</a>';
        } else {
          html +=
            '<div class="card soon" role="button" tabindex="0" data-soon="1" aria-disabled="true" data-level="' + n + '">' +
              '<span class="n">' + n + '</span>' +
              '<p class="name">' + esc(lv.name) + '</p>' +
              '<p class="boss">Boss · ' + esc(lv.bossName || '待定') + '</p>' +
              '<span class="st">即将开放</span>' +
              '<span class="flash">先试完第1–4关</span>' +
            '</div>';
        }
      }
      html +=
        '<a class="card playable" href="' + playHref(9) + '" data-level="9">' +
          '<span class="n">9</span>' +
          '<p class="name">我的关卡</p>' +
          '<p class="boss">自制关 · 工坊存档</p>' +
          '<span class="st">' + (levelDone(prog, 9) ? '已试 · 再玩' : '可玩 · 进试玩') + '</span>' +
        '</a>';
      grid.innerHTML = html;
      grid.querySelectorAll('.card.soon').forEach(function (el) {
        function flash() {
          el.classList.add('show-flash');
          clearTimeout(el._t);
          el._t = setTimeout(function () { el.classList.remove('show-flash'); }, 1400);
        }
        el.addEventListener('click', flash);
        el.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); flash(); }
        });
      });
      if (unlocked) {
        lead.innerHTML = '已试完 <b>1–4</b>：点任意关<strong>一下</strong>直达试玩（无二次确认）。正式名 <b>伍澍暘</b> / 助手 <b>小宇</b>。';
        note.textContent = '解锁全开 · tip ls2 · 一点进关 → custom-play?v=c51&level=N。进度键 localStorage sycocos-level-progress。';
      } else {
        var missing = [];
        for (var j = 1; j <= 4; j++) if (!levelDone(prog, j)) missing.push(j);
        lead.innerHTML = '先点进 <b>1–4</b> 各试一次；还差关 <b>' + missing.join('、') + '</b>。试完后 5–8 也可一点进关。第 <b>9</b> 关随时可玩。';
        note.textContent = '试完规则：进过该关试玩页即算试过（过关会记 completed）。5–8 在闸未开前诚实「即将开放」。不改 PeerJS。';
      }
    }

    render(FALLBACK);
    fetch('data/roster.json?v=ls2', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !Array.isArray(data.levels) || !data.levels.length) return;
        render(data.levels.slice(0, 8));
      })
      .catch(function () { /* fallback already rendered */ });
  })();
  </script>
</body>
</html>
