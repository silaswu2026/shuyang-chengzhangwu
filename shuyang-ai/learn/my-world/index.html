<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="../../../favicon.png" type="image/png"/>
  <link rel="apple-touch-icon" href="../../../apple-touch-icon.png"/>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="theme-color" content="#0f1230"/>
  <meta name="xy-tip" content="mw2"/>
  <title>伍澍暘的方块小世界</title>
  <link rel="stylesheet" href="../../../brand-tokens.css"/>
  <link rel="stylesheet" href="my-world.css?v=mw2"/>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <p id="disclaimer">自研小游戏，不是正版《我的世界》。</p>
    <p id="peace">这游戏没有怪物。</p>
    <p id="hint">小宇：树干、树叶、泥土、石头都能敲，敲下来的进背包。</p>
    <p id="meta"><span id="bag"></span><span class="tip">mw2</span></p>
    <div id="cross" aria-hidden="true"></div>
    <div id="bar" aria-hidden="true"><i id="barFill"></i></div>
    <div id="joy" aria-hidden="true"><i id="knob"></i></div>
    <div id="actions">
      <button type="button" id="jump">跳</button>
      <button type="button" id="punch">敲</button>
    </div>
    <p id="keys">WASD 走路 · 鼠标看 · 左键敲方块 · 空格跳</p>
    <p id="toast" aria-live="polite"></p>
  </div>
  <div id="start">
    <p class="who">小宇</p>
    <h1>方块小世界</h1>
    <p class="lead">伍澍暘，这是一块方的世界。地、树、叶子都是方块。对准就能敲，敲下来的进背包。</p>
    <button type="button" id="go">开始玩</button>
    <p class="disclaimer">自研小游戏，不是正版《我的世界》。</p>
    <p class="peace">这游戏没有怪物。</p>
  </div>
  <script src="my-world.js?v=mw2"></script>
</body>
</html>
