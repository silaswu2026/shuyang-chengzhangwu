<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="../../../favicon.png" type="image/png"/>
  <link rel="apple-touch-icon" href="../../../apple-touch-icon.png"/>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <meta name="theme-color" content="#0f1230"/>
  <meta name="xy-tip" content="mw13"/>
  <title>伍澍暘的方块小世界</title>
  <link rel="stylesheet" href="../../../brand-tokens.css"/>
  <link rel="stylesheet" href="my-world.css?v=mw13"/>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="names" aria-hidden="true"></div>
  <div id="hud">
    <p id="disclaimer">自研小游戏，不是正版《我的世界》。</p>
    <p id="peace">这游戏没有怪物。</p>
    <p id="sunClock">太阳升起 · 06:00</p>
    <p id="hint">小宇：上一级台阶要按跳。背包格子里点一下，就能换手里的东西。</p>
    <p id="meta"><span class="tip">mw13</span></p>
    <p id="roomCode" hidden>房间码</p>
    <div id="stickers"></div>
    <div id="rain" aria-hidden="true"></div>
    <p id="hpLine"><span id="hpText">血 6</span><i id="hpTrack"><i id="hpFill"></i></i></p>
    <p id="net"><span id="netText"></span> <button type="button" id="leave" hidden>断开</button></p>
    <div id="equip">
      <span id="coins">金币 0</span>
    </div>
    <div id="mapWrap">
      <button type="button" id="mapBtn" class="on">地图</button>
      <canvas id="map" width="82" height="82"></canvas>
    </div>
    <div id="hurt" aria-hidden="true"></div>
    <div id="sleep" hidden></div>
    <div id="cross" aria-hidden="true"></div>
    <div id="bar" aria-hidden="true"><i id="barFill"></i></div>
    <div id="joy" aria-hidden="true"><i id="knob"></i></div>
    <div id="pack"></div>
    <div id="actions">
      <button type="button" id="jump">跳</button>
      <button type="button" id="punch">敲</button>
      <button type="button" id="place">放</button>
      <button type="button" id="make">做</button>
      <button type="button" id="ride" hidden>上船</button>
      <button type="button" id="sit" hidden>坐下</button>
      <button type="button" id="sleepBtn" hidden>睡觉</button>
      <button type="button" id="trade" hidden>换火把</button>
      <button type="button" id="emote">表情</button>
    </div>
    <div id="emotes" hidden>
      <button type="button" data-emote="hi">👋</button>
      <button type="button" data-emote="happy">😄</button>
      <button type="button" data-emote="wow">😮</button>
      <button type="button" data-emote="love">❤️</button>
      <button type="button" data-emote="sad">😢</button>
    </div>
    <p id="myEmote"></p>
    <p id="keys">WASD 走 · 鼠标看 · 左键敲 · 右键放 · 空格跳</p>
    <p id="toast" aria-live="polite"></p>
    <div id="craft" hidden>
      <div class="card">
        <p class="who">小宇的制作</p>
        <p id="woodGate">先敲到 1 个木头，才能做火把和小船</p>
        <button type="button" data-craft="torch" data-wood-gate="1">火把 · 3木头</button>
        <button type="button" data-craft="boat" data-wood-gate="1">小船 · 10木头</button>
        <button type="button" data-craft="gun">枪 · 2石头1木头</button>
        <button type="button" data-craft="bed">床 · 3木头2羊毛</button>
        <button type="button" data-craft="axe">木斧 · 3木头</button>
        <button type="button" data-craft="pickIron">铁镐 · 3铁1木头</button>
        <button type="button" data-craft="armorWood">木甲 · 6木头</button>
        <button type="button" data-craft="armorIron">铁甲 · 6铁</button>
        <button type="button" data-craft="shears">剪刀 · 2铁</button>
        <button type="button" data-craft="wheat">小麦 · 2树叶</button>
        <button type="button" data-craft="swordWood">木剑 · 3木头</button>
        <button type="button" data-craft="swordStone">石剑 · 2石头1木头</button>
        <button type="button" data-craft="swordIron">铁剑 · 2铁1木头</button>
        <button type="button" data-craft="armor">叶衣 · 8树叶</button>
        <button type="button" data-craft="pick">石稿 · 3石头1木头</button>
        <button type="button" data-craft="sell">卖木头 · 1木头换1金币</button>
        <button type="button" id="craftClose">关掉</button>
      </div>
    </div>
  </div>
  <div id="start">
    <p class="who">小宇</p>
    <h1>方块小世界</h1>
    <p class="lead">伍澍暘，每次打开都是新的一局。林子里能砍到木头。野猪会追，羊和鸡会跑，牛又慢又耐打。山上有雪，待久了会冷。</p>
    <p class="nameRow">你叫 <b id="nameLabel">乐乐</b></p>
    <div class="goRow">
      <button type="button" id="rename">换名字</button>
      <button type="button" id="go">一个人玩</button>
      <button type="button" id="host">当房主</button>
      <button type="button" id="join">加入朋友</button>
    </div>
    <p class="nameRow">跨网络房间码 <input id="roomIn" inputmode="numeric" maxlength="4" placeholder="4位数字"/></p>
    <p id="roomWait"></p>
    <button type="button" id="netCancel" hidden>取消</button>
    <p class="disclaimer">自研小游戏，不是正版《我的世界》。</p>
    <p class="peace">这游戏没有怪物。</p>
  </div>
  <script src="../../../vendor/peerjs/peerjs.min.js"></script>
  <script src="my-world.js?v=mw13"></script>
</body>
</html>
